<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saihon</title>
    <link rel="icon" href="./assets/imagenes/logo/favicon.png" type="image/png">
    <link rel="stylesheet" href="./css/plantilla.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <style>
       @media (min-width: 320px) and (max-width: 426px){
        .div-container{
          display: none;
         }
        .aside{
          display: none;
        }
        .main{
          display: flex;
          flex-direction: column;
          margin-left: 0.5rem;
         }
        .footer-info, .footer-infotation {
          font-size: 0.7rem; 
      }
      .dos{
          display: flex;
          flex-direction: column;
          gap: 40px;
        }
      .foot{
          height: 50vh;
        }
      #card-libro-año{
        margin: 0 0 0 0;
      }

      }

      @media (min-width: 427px) and (max-width: 1023px){
         .aside{
          display: none;
         }
         .div-container{
          display: none;
         }
         .main{
          display: flex;
          flex-direction: column;
          margin-left: 1rem;
         }
         .row{
          display: flex;
          justify-content: center;
         }
         .footer-info,
        .footer-infotation {
          font-size: 0.7rem; /* Ajusta el tamaño de la fuente para pantallas pequeñas */
        }
        .foot {
          margin: 0;
          height: 50vh;
          display: flex;
        }
        .foot dos {
          flex-direction: column;
        }
        .foot {
          margin: 0;
        }
      }
      @media (min-width: 1024px) and (max-width: 1439px) {
        #books-img{
          height: 25vh;
        }
        #logo-img{
          height: 20vh;
        }
      }
    </style>
</head>
<body>
    <header id = "header">
      
    </header>

    <div class="div-container">
        <div id="logo-portada">
          <img src="./assets/imagenes/logo/saihon-logo.png" alt="" id="logo-img">
        </div>
        <div id="libros-portada">
          <img src="./src/books-5937823_1280.jpg" alt="100$" id="books-img">
        </div>
    </div>

    <main class="main">
      <aside class="aside">
        <div class="aside__genres">
          <span class="aside__title">Libros por género</span>

          <ul class="aside__list">
            <li class="aside__item"><a href="./catalogo.html" class="aside__link">Todos los géneros</a></li>
            <li class="aside__item"><a href="./catalogo.html" class="aside__link">Negocios</a></li>
            <li class="aside__item"><a href="./catalogo.html" class="aside__link">Ciencia</a></li>
            <li class="aside__item"><a href="./catalogo.html" class="aside__link">Ficción</a></li>
            <li class="aside__item"><a href="./catalogo.html" class="aside__link">Filosofía</a></li>
            <li class="aside__item"><a href="./catalogo.html" class="aside__link">Biología</a></li>
          </ul>
        </div>

        <div class="aside__recommendations">
          <span class="aside__title">Recomendaciones</span>

          <ul class="aside__list">
            <li class="aside__item"><a href="#sec-autores-mes" class="aside__link">Autores(as) del mes</a></li>
            <li class="aside__item"><a href="#sec-libro-año" class="aside__link">Libro del año</a></li>
            <li class="aside__item"><a href="#sec-populares" class="aside__link">Populares</a></li>
            <!-- <li class="aside__item"><a href="" class="aside__link">Top géneros</a></li> -->
            <li class="aside__item"><a href="#sec-tendencias" class="aside__link">Tendencias</a></li>
          </ul>
        </div>
      </aside>

      <section class="section">
        <!-- Seccion Autores(as) del mes -->
        <div class="section__content" id="sec-autores-mes">
          <h3>Autores(as) del mes</h3>
          <div id="carousel-recomendaciones" class="carousel slide">
            <div class="carousel-inner">
              <!-- Slide 1 -->
              <div class="carousel-item active">
                <div class="row" id="autores-mes-uno">

                </div>
              </div>
              <!-- Slide 2 -->
              <div class="carousel-item">
                <div class="row" id="autores-mes-dos">

                </div>
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carousel-recomendaciones" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carousel-recomendaciones" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
          <div class="container-boton">
            <a type="button" class="btn" id="ver-recomendaciones" href="./catalogo.html">Ver más</a>
          </div>
        </div>

        <!-- Seccion libro del año -->
        <div class="section__content" id="sec-libro-año">

          <div class="container-boton">
            <a type="button" class="btn" id="ver-libro-año" href="./catalogo.html">Ver más</a>
          </div>
        </div>

        <!-- Seccion Populares -->
        <div class="section__content" id="sec-populares">
          <h3>Populares</h3>
          <div id="carousel-populares" class="carousel slide">
            <div class="carousel-inner">
              <!-- Slide 1 -->
              <div class="carousel-item active">
                <div class="row" id="populares-uno">

                </div>
              </div>
              <!-- Slide 2 -->
              <div class="carousel-item">

                <div class="row" id="populares-dos">

              </div>

              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carousel-populares" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carousel-populares" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
          <div class="container-boton">
            <a type="button" class="btn" id="ver-populares" href="./catalogo.html">Ver más</a>
          </div>
        </div>

        <!-- Seccion Tendencias  -->
        <div class="section__content" id="sec-tendencias">
          <h3>Tendencias</h3>
          <div id="carousel-tendencias" class="carousel slide">
            <div class="carousel-inner">
              <!-- Slide 1 -->
              <div class="carousel-item active">
                <div class="row" id="tendencias-uno">

                </div>
              </div>
              <!-- Slide 2 -->
              <div class="carousel-item">

                <div class="row" id="tendencias-dos">

              </div>

              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carousel-tendencias" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carousel-tendencias" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
          <div class="container-boton">
            <a type="button" class="btn" id="ver-tendencias" href="./catalogo.html">Ver más</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot dos" id="footer">
      
    </footer>
    
    <script src="js/main.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
