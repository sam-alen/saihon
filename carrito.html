<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de compras</title>
    <link rel="icon" href="./assets/imagenes/logo/favicon.png" type="image/png">

  </head>

    <style>

@media (min-width: 320px) and (max-width: 426px){

  /*===CUERPO DE LA PAGINA=*/

body{
  box-sizing: border-box;
}

  main{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
 }

 /*==="MI CARRITO DE COMPRAS"===*/

 .TituloCarrito{
  width: 100vw;
  margin-left: 2em;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
 }

 .TituloCarrito>h2{
  font-size: 1.5em;
 }

 #carritoMain{
    width: 2em;
    height: auto;
    background-color:#E1351F;
    padding: 0.3em;
    border-radius: 50%;
 }

 /*====TABLA DE PRODUCTOS=====*/

 .compras{
    height: auto;
    width: 99vw;
 }

 .tablaDiv{
    width: 99vw;
 }
 

.tablaDiv .title{
   background-color: var(--main-darkblue-color);
   color: #F9F9F9;
 }

 #btnEliminar{
  font-size: small;
  width: 3.7em;
 }

.tablaDiv .col {
   display: flex;
   flex-direction: column;
   flex-wrap: wrap;
   align-items: center;
   justify-content: center;
   font-size: small;
   gap: 3em;
   width: 5rem;
   height: auto;
 }

input{
   display: flex;
   width: 2em;
   justify-content: center;
 }

 .tablaDiv .compras {
   display: flex;
   flex-direction: column;
 }
 
 .tablaDiv .row {
   display: flex;
   width: 99vw;
 }

 /*=====DIVS DE LAS TARJETAS=======*/
 #pago{
    margin: 3em;
    padding: 2em;
    box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 90vw;
}

#logoTarjeta{
    width: 2em;
    height: auto;
}

#pago>.form-check>.form-check-label{
    display: flex;
    flex-direction: row;
    gap: 1rem;
}

.datosTarjeta{
   box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
   /* width: 35vw;  */
   height: 100%;
   padding: 2em;
   display: flex;
   flex-direction: column;
   
}

.addTarjeta{
   display: none;
   flex-direction: column;
}

.addTarjeta .form1{
  width: 90vw;
}

.addTarjeta .datosTarjeta{
  width: 90vw;
  margin-bottom: 4em;
}

/*======FOOTER=======*/
.footer-info, .footer-infotation {
          font-size: 0.7rem; /*Ajusta el tamaño de la fuente para pantallas pequeñas*/
      }
      .dos{
        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      .foot{
        width: 100%;
        height: 50vh;
      }

}

@media (min-width: 427px) and (max-width: 990px){

  /*=====CUERPO=====*/

    /*===CUERPO DE LA PAGINA=*/

body{
  box-sizing: border-box;
}

  main{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
 }

 /*==="MI CARRITO DE COMPRAS"===*/

 .TituloCarrito{
  width: 100vw;
  margin-left: 2em;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
 }

 .TituloCarrito>h2{
  font-size: 1.5em;
 }

 #carritoMain{
    width: 2em;
    height: auto;
    background-color:#E1351F;
    padding: 0.3em;
    border-radius: 50%;
 }


/*=====DIVS DE LAS TARJETAS======*/
#pago{
    margin: 3em;
    padding: 2em;
    box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 80vw;
}

#logoTarjeta{
    width: 2em;
    height: auto;
}

#pago>.form-check>.form-check-label{
    display: flex;
    flex-direction: row;
    gap: 1rem;
}

.datosTarjeta{
   box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
   /* width: 35vw;  */
   height: 100%;
   padding: 2em;
   display: flex;
   flex-direction: column;
   
}

.addTarjeta{
   display: none;
   flex-direction: column;
}

.addTarjeta .form1{
  width: 80vw;
}

.addTarjeta .datosTarjeta{
  width: 80vw;

}

@media (min-width: 1024px){


}

<body>
<!------HEADER------>
    <header id="header">
    </header>
    
<!------BODY------->    

<main>
<div class="TituloCarrito">
    <h2> <img src="assets/imagenes/logo/shopping-cart.svg" alt="carrito de compras" id="carritoMain"> MI CARRITO <span style="color: #E1351F;">DE COMPRAS</span> </h2>
</div>
<hr>

<div class="tablaDiv">
  <div class="compras">
    <div class="title row">
      <div class="col" id="librosTitle">LIBROS</div>
      <div class="col">PRECIO</div>
      <div class="col" id="cantidadInput">CANTIDAD</div>
      <div class="col">SUBTOTAL</div>
      <div class="col"></div>
    </div>
    <div class="tbody">
      
    </div>
  </div>
</div>

  <div>
    <div> 
        <h5>TOTAL: <span id="total"></span></h5> 
    </div>
    <br>
        <button id="limpiar" class="btn btn-light">Vaciar carrito</button>
        <button id="pagar" class="btn btn-success">Pagar</button>
  </div>

  <div id="pago">
    <h5>Forma de pago</h5>
    <div class="form-check" id="checkTarjeta">
        <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
        <label class="form-check-label" for="flexRadioDefault1"><img src="assets/imagenes/logo/card-2.svg" id="logoTarjeta" alt="logo tarjeta">
            Tarjeta Visa terminación **98      |    Juan Pérez   |      05/25
        </label>

      </div>

      <div class="agregarTarjeta">
        <button type="button" class="btn btn-primary" id="btnTarjeta" href="#tarjetaFormulario"> + Agregar Tarjeta</button>
      </div>
  </div>
<div class="addTarjeta" id="datosPago">
  <div id="form1">
    <form class="datosTarjeta"><!--Formulario-->
        <div class="mb-3 campos">
            <h3>Datos de personales</h3>
            <label for="exampleInputName" class="form-label">Nombre completo</label>
            <input type="name" class="form-control input-form" id="exampleInputName" placeholder="👤 Ricardo López">
            <span id="errorNombre"></span>
        </div>
        <div class="mb-3 campos">
          <div id="emailHelp" class="form-text"></div>
          <label for="exampleInputPhone" class="form-label">Número telefónico</label>
          <input type="tel" class="form-control input-form" id="exampleInputPhone" aria-describedby="emailHelp" placeholder="📞 844 606 2578">
            <span id="errorTelefono"></span>
        </div>
        <div class="mb-3 campos">
            <label for="exampleInputEmail" class="form-label">Correo electrónico</label>                              
            <input type="email" class="form-control input-form" id="exampleInputEmail" aria-describedby="emailHelp" placeholder="✉️ usuario@ejemplo.com">
            <div id="emailHelp" class="form-text"></div>
            <span id="errorEmail"></span>
        </div>
        <div class="mb-3 campos">
          <div id="emailHelp" class="form-text"></div>
          <label for="exampleInputPhone" class="form-label">Dirección completa</label>
          <input type="text" class="form-control input-form" id="exampleInputAddress" aria-describedby="emailHelp" placeholder="🏠 Villa de Avala #140 Valleverde  ">
            <span id="errorTelefono"></span>
        </div>
    </form>
  </div>
  <br>
  <div class="datosTarjeta">
    <div id="tarjetaFormulario" >
      <h3>Datos de la tarjeta</h3>
        <label for="inputNumero" class="form-label">Número de tarjeta</label>
        <input type="text" id="inputNumero" class="form-control" aria-describedby="numeroHelpBlock">
        <div id="numeroHelpBlock" class="form-text">
             Ingresa el número de tarjeta
        </div>
        <br>
        <label for="inputFecha" class="form-label">Vigencia</label>
        <input type="text" id="inputFecha" class="form-control" aria-describedby="fechaHelpBlock" placeholder="mm/aa">
        <div id="fechaHelpBlock" class="form-text">
             Ingresa el mes y año de vencimiento
        </div>
        <br>
        <label for="inputFecha" class="form-label">Código de seguridad</label>
        <input type="text" id="inputCod" class="form-control" aria-describedby="fechaHelpBlock">
        <div id="fechaHelpBlock" class="form-text">
          <br>
          <button type="button" class="btn btn-primary" id="nuevaTarjeta">Guardar tarjeta</button>
        </div>
    </div>
  </div>
</div>
  


</main>

<!------FOOTER------>
    <footer class="foot dos" id = "footer"> 
    </footer>

    <script src="js/carrito.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
